
name: Package Java Swing App for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.jar'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check input JAR
        shell: pwsh
        run: |
          if (!(Test-Path "app.jar")) {
            throw "app.jar topilmadi. Uni repository asosiy papkasiga yuklang."
          }

          java -version
          jar tf app.jar | Select-Object -First 10

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          $wix = Get-ChildItem `
            "C:\Program Files (x86)\WiX Toolset*" `
            -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($wix) {
            $bin = Join-Path $wix.FullName "bin"
            if (Test-Path $bin) {
              Add-Content $env:GITHUB_PATH $bin
            }
          }

      - name: Verify WiX
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          $light = Get-Command light.exe -ErrorAction SilentlyContinue

          if (!$candle -or !$light) {
            throw "WiX candle.exe yoki light.exe topilmadi."
          }

      - name: Prepare application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-input | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item app.jar package-input\app.jar

      - name: Create Windows installer with bundled Java
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --name MyApp `
            --app-version 1.0.0 `
            --input package-input `
            --main-jar app.jar `
            --dest dist `
            --win-menu `
            --win-shortcut `
            --win-dir-chooser

          if (!(Test-Path "dist\MyApp-1.0.0.exe")) {
            throw "O'rnatuvchi EXE yaratilmadi."
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-Windows-Installer
          path: dist/MyApp-1.0.0.exe
          if-no-files-found: error
