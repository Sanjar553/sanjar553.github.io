
      - name: Include Visual C++ Runtime
        shell: pwsh
        run: |
          $roots = @(
            "C:\Program Files\Microsoft Visual Studio\2022",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022"
          )

          $crt = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $crt = Get-ChildItem $root -Recurse -Filter vcruntime140.dll -File -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'Microsoft\.VC\d+\.CRT\\' } |
                Select-Object -First 1
              if ($crt) { break }
            }
          }

          if (!$crt) {
            throw "Visual C++ runtime DLL topilmadi"
          }

          $runtimeDir = $crt.DirectoryName
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$runtimeDir\*.dll" dist\ -Force
          Write-Host "Runtime files copied from $runtimeDir"
