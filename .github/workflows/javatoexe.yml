
name: Build Java JAR to Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.jar'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check JAR
        shell: pwsh
        run: |
          if (!(Test-Path "app.jar")) {
            throw "app.jar topilmadi. Uni repository asosiy papkasiga joylang."
          }

      - name: Build EXE
        shell: pwsh
        run: |
          native-image --version
          native-image --no-fallback -jar app.jar -o MyApp

      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item MyApp.exe dist\

          $dlls = Get-ChildItem -Path . -Filter *.dll -File
          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName dist\ -Force
          }

          $crtNames = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          $searchRoots = @(
            "C:\Program Files\Microsoft Visual Studio",
            "C:\Program Files (x86)\Microsoft Visual Studio",
            "C:\Windows\System32"
          )

          foreach ($name in $crtNames) {
            $found = $null

            foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                $found = Get-ChildItem -Path $root -Filter $name -File -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 1
              }
              if ($found) { break }
            }

            if ($found) {
              Copy-Item $found.FullName dist\ -Force
              Write-Host "Topildi: $name"
            } else {
              Write-Warning "$name topilmadi"
            }
          }

          Write-Host "Paket tarkibi:"
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-Windows
          path: dist/*
          if-no-files-found: error
