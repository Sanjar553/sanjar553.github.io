name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: RDP Xizmatlarini to'liq ishga tushirish
      shell: powershell
      run: |
        # Parol va User yaratish
        secedit /export /cfg cfg.ini
        (Get-Content cfg.ini) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content cfg.ini
        secedit /configure /db $env:windir\security\new.sdb /cfg cfg.ini /areas SECURITYPOLICY
        net user Sanjar "${{ secrets.PC_PASSWORD }}" /add
        net localgroup Administrators Sanjar /add
        
        # RDP Registry va Servislarini yoqish
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # RDP xizmatini majburiy qayta yoqish
        Restart-Service -Name "TermService" -Force

    - name: Tailscale orqali Tarmoqqa ulash
      shell: powershell
      run: |
        choco install tailscale -y
        tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}
        Start-Sleep -Seconds 5
        $ip = (tailscale ip -4)
        Write-Host "==========================================" -ForegroundColor Green
        Write-Host "ULANISH UCHUN TAILSCALE IP: $ip" -ForegroundColor Yellow
        Write-Host "==========================================" -ForegroundColor Green

    - name: Cloud PC-ni ochiq tutish (6 soat)
      shell: powershell
      run: |
        Start-Sleep -Seconds 21600
