name: Windows Cloud PC (RustDesk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: RustDesk yuklab olish va o'rnatish
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe" -OutFile "rustdesk.exe"
        Start-Process -FilePath ".\rustdesk.exe" -ArgumentList "--install" -Wait
        
        # Parol o'rnatish
        & "C:\Program Files\RustDesk\rustdesk.exe" --password ${{ secrets.PC_PASSWORD }}

    - name: RustDesk ID ko'rsatish
      shell: powershell
      run: |
        Start-Sleep -Seconds 10
        $id = & "C:\Program Files\RustDesk\rustdesk.exe" --get-id
        Write-Host "==========================================" -ForegroundColor Green
        Write-Host "RUSTDESK ID MANZILI: $id" -ForegroundColor Yellow
        Write-Host "PAROL: Siz GitHub Secrets'ga qo'ygan PC_PASSWORD" -ForegroundColor Yellow
        Write-Host "==========================================" -ForegroundColor Green

    - name: Cloud PC-ni ochiq tutish (6 soat)
      shell: powershell
      run: |
        Start-Sleep -Seconds 21600
