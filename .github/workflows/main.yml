name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Parol siyosatini o'chirish va User yaratish
      shell: powershell
      run: |
        secedit /export /cfg cfg.ini
        (Get-Content cfg.ini) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content cfg.ini
        secedit /configure /db $env:windir\security\new.sdb /cfg cfg.ini /areas SECURITYPOLICY
        net user Sanjar "${{ secrets.PC_PASSWORD }}" /add
        net localgroup Administrators Sanjar /add
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Ngrok o'rnatish va Tunnelni ochish
      shell: powershell
      run: |
        choco install ngrok -y
        ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
        
        # Ngrok-ni fon rejimida xatosiz yurgizish
        $process = Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389" -PassThru -NoNewWindow
        
        # Ngrok to'liq ishga tushishi uchun 15 soniya kutamiz
        Start-Sleep -Seconds 15
        
        # Tunnel manzilini olish
        try {
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
            $publicUrl = $response.tunnels[0].public_url
            echo "=================================================="
            echo "MANZIL: $publicUrl"
            echo "=================================================="
        } catch {
            echo "Ngrok javob bermadi, qayta urinib ko'rilmoqda..."
            Start-Sleep -Seconds 5
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
            echo "MANZIL: $($response.tunnels[0].public_url)"
        }

    - name: Cloud PC-ni ochiq tutish (6 soat)
      shell: powershell
      run: |
        Start-Sleep -Seconds 21600
