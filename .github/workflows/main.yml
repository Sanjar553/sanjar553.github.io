name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Parol siyosatini o'chirish va User yaratish
      shell: powershell
      run: |
        secedit /export /cfg cfg.ini
        (Get-Content cfg.ini) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content cfg.ini
        secedit /configure /db $env:windir\security\new.sdb /cfg cfg.ini /areas SECURITYPOLICY
        net user Sanjar "${{ secrets.PC_PASSWORD }}" /add
        net localgroup Administrators Sanjar /add
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Ngrok o'rnatish va RDP-ni ulash
      shell: powershell
      run: |
        choco install ngrok -y
        ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
        Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389"

    - name: Ulanish manzili va Portni chiqarish
      shell: powershell
      run: |
        Start-Sleep -Seconds 10
        echo "============================================="
        try {
            $log = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
            $publicUrl = $log.tunnels[0].public_url
            echo "ULANISH UCHUN MANZIL: $publicUrl"
        } catch {
            echo "Ngrok ulana olmadi. Secret'larni tekshiring."
        }
        echo "============================================="

    - name: Cloud PC-ni ochiq tutish (6 soat)
      shell: powershell
      run: |
        Start-Sleep -Seconds 21600
