- name: Pinggy tunnelini ochish
      shell: powershell
      run: |
        Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 a.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log"
        Start-Sleep -Seconds 15
        Write-Host "==========================================" -ForegroundColor Green
        Get-Content pinggy.log
        Get-Content pinggy_err.log
        Write-Host "==========================================" -ForegroundColor Green
