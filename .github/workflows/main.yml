name: Windows Cloud PC (Tailscale RDP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: User va Firewall sozlamalarini to'liq ochish
      shell: powershell
      run: |
        secedit /export /cfg cfg.ini
        (Get-Content cfg.ini) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content cfg.ini
        secedit /configure /db $env:windir\security\new.sdb /cfg cfg.ini /areas SECURITYPOLICY
        net user Sanjar "${{ secrets.PC_PASSWORD }}" /add
        net localgroup Administrators Sanjar /add
        
        # RDP va Xavfsizlik devorini (Firewall) to'liq o'chirish
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False

    - name: Tailscale yuklash va ulanish
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale.exe"
        Start-Process -FilePath ".\tailscale.exe" -ArgumentList "/quiet" -Wait
        
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --unattended --accept-routes
        
        Start-Sleep -Seconds 8
        $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        Write-Host "==========================================" -ForegroundColor Green
        Write-Host "WINDOWS APP UCHUN IP MANZIL: $ip" -ForegroundColor Yellow
        Write-Host "==========================================" -ForegroundColor Green

    - name: Cloud PC-ni ochiq tutish (6 soat)
      shell: powershell
      run: |
        Start-Sleep -Seconds 21600
        
