name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Tailscale-ni yuklab olish va o'rnatish
      shell: powershell
      run: |
        echo "Tailscale yuklanmoqda..."
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        echo "O'rnatilmoqda..."
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
        
        echo "Tailscale ishga tushirilmoqda..."
        $env:PATH += ";C:\Program Files\Tailscale"
        tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

    - name: Windows foydalanuvchisi va Remote Desktop-ni sozlash
      shell: powershell
      run: |
        net user runneradmin "${{ secrets.PC_PASSWORD }}"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Cloud PC-ni ochiq tutish (6 soat)
      shell: powershell
      run: |
        echo "Cloud PC muvaffaqiyatli ishga tushdi!"
        echo "Tailscale dashboard orqali IP manzilni oling va RDP (mstsc) orqali ulaning."
        Start-Sleep -Seconds 21600
