name: Windows Cloud PC (Localtonet RDP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: User yaratish va RDP sozlash
      shell: powershell
      run: |
        secedit /export /cfg cfg.ini
        (Get-Content cfg.ini) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content cfg.ini
        secedit /configure /db $env:windir\security\new.sdb /cfg cfg.ini /areas SECURITYPOLICY
        net user Sanjar "${{ secrets.PC_PASSWORD }}" /add
        net localgroup Administrators Sanjar /add
        
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False

    - name: Localtonet orqali RDP tunnel ochish
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://localtonet.com/download/localtonet-win-x64.zip" -OutFile "localtonet.zip"
        Expand-Archive -Path "localtonet.zip" -DestinationPath "."
        
        # Token bilan avtorizatsiya va TCP 3389 portni ishga tushirish
        .\localtonet.exe authtoken ${{ secrets.LOCALTONET_TOKEN }}
        Start-Process -FilePath ".\localtonet.exe" -ArgumentList "tcp 3389" -RedirectStandardOutput "localtonet.log"
        
        Start-Sleep -Seconds 10
        Write-Host "==========================================" -ForegroundColor Green
        Write-Host "Localtonet Dashboard (My Tunnels) ga kiring, IP va Port tayyor!" -ForegroundColor Yellow
        Write-Host "==========================================" -ForegroundColor Green

    - name: Cloud PC-ni ochiq tutish (6 soat)
      shell: powershell
      run: |
        Start-Sleep -Seconds 21600
