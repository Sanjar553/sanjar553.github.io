name: Windows Cloud PC (Full Setup & Cache)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repozitoriyani yuklash
      uses: actions/checkout@v4

    - name: Keshni tiklash / saqlash (User profili, Downloads va Dasturlar)
      uses: actions/cache@v4
      with:
        path: |
          C:\Users\Sanjar
          C:\ProgramData\chocolatey
        key: windows-pc-full-cache-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          windows-pc-full-cache-${{ runner.os }}-

    - name: User yaratish va RDP sozlash
      shell: powershell
      run: |
        secedit /export /cfg cfg.ini
        (Get-Content cfg.ini) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content cfg.ini
        secedit /configure /db $env:windir\security\new.sdb /cfg cfg.ini /areas SECURITYPOLICY
        
        # User bor-yo'qligini tekshirib yaratish
        if (-not (Get-LocalUser -Name "Sanjar" -ErrorAction SilentlyContinue)) {
            net user Sanjar "${{ secrets.PC_PASSWORD }}" /add
            net localgroup Administrators Sanjar /add
        } else {
            net user Sanjar "${{ secrets.PC_PASSWORD }}"
        }
        
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False

    - name: Pinggy TCP Tunnel yoqish
      shell: cmd
      run: |
        start /b ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:3389 tcp@a.pinggy.io > pinggy.log 2>&1
        ping 127.0.0.1 -n 21 > nul
        type pinggy.log
        findstr /C:"a.pinggy.io" pinggy.log

    - name: Cloud PC-ni ochiq tutish (6 soat)
      shell: powershell
      run: |
        Start-Sleep -Seconds 21600
